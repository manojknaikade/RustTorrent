[package]
name = "rusttorrent"
description = "A torrent client with everything in one window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusttorrent-core = { path = "../core" }
eframe = "0.37"
egui_extras = "0.37"
rfd = "0.18"
png = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[features]
# Lets RUSTTORRENT_SHOT=<file.png> save a picture of the window. Used for testing only.
shot = ["dep:png"]
