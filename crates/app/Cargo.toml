[package]
name = "rusttorrent"
description = "A torrent client with everything in one window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusttorrent-core = { path = "../core" }
# The wgpu renderer (Metal on macOS). OpenGL (glow) made the binary 3 MB smaller but
# took about 11 MB more memory at idle on macOS. Linux window systems stay so the
# portable check builds.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
# Only the table; the default file loader is not used.
egui_extras = { version = "0.37", default-features = false }
rfd = "0.18"
png = { version = "0.18", optional = true }

# On macOS the app talks to the pasteboard itself (text only, see mac.rs). The
# clipboard crate also handles images, which brought in image decoders.
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[features]
# Lets RUSTTORRENT_SHOT=<file.png> save a picture of the window. Used for testing only.
shot = ["dep:png"]
