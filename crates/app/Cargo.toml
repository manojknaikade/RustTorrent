[package]
name = "rusttorrent"
description = "A torrent client with everything in one window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusttorrent-core = { path = "../core" }
# The OpenGL renderer (glow) instead of the default wgpu: a few megabytes smaller and
# plenty for a list of torrents. Linux window systems stay so the portable check builds.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
# Only the table; the default file loader is not used.
egui_extras = { version = "0.37", default-features = false }
rfd = "0.18"
png = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[features]
# Lets RUSTTORRENT_SHOT=<file.png> save a picture of the window. Used for testing only.
shot = ["dep:png"]
