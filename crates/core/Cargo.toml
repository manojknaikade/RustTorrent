[package]
name = "rusttorrent-core"
description = "RustTorrent rules, storage and engine adapter. No user-interface code."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
librqbit = "=9.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Already part of the build through reqwest; used for hashing the remote-control password.
aws-lc-rs = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
regex-lite = "0.1"
# Already part of the build through reqwest; used for the optional HTTPS of the remote control.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
