<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RustTorrent</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<main id="login" hidden>
  <form id="login-form" class="card narrow">
    <h1>RustTorrent</h1>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</main>

<main id="app" hidden>
  <header>
    <h1>RustTorrent</h1>
    <span id="speeds" class="muted"></span>
    <button id="slow" aria-pressed="false" title="Slow mode: the second, lower set of speed limits">Slow mode</button>
    <button id="sign-out" class="quiet">Sign out</button>
  </header>

  <p id="banner" class="banner" role="status" hidden></p>

  <form id="add-form" class="row">
    <input id="add-text" type="text" placeholder="Magnet link or web address of a .torrent file"
           aria-label="Magnet link or web address of a .torrent file" autocomplete="off" required>
    <button class="primary">Add</button>
  </form>
  <label class="upload"><input id="upload" type="file" accept=".torrent,application/x-bittorrent"> Or send a .torrent file from this device</label>
  <p id="message" class="muted" role="status"></p>

  <ul id="list"></ul>
  <p id="empty" class="muted center" hidden>No torrents yet.</p>

  <details class="card">
    <summary>Speed limits</summary>
    <form id="limits-form" class="limits">
      <label>Download, KiB/s <input id="limit-down" type="number" min="0" max="4000000" inputmode="numeric"></label>
      <label>Upload, KiB/s <input id="limit-up" type="number" min="0" max="4000000" inputmode="numeric"></label>
      <button>Set</button>
      <span class="muted">0 means no limit.</span>
    </form>
  </details>

  <details class="card">
    <summary>Slow mode, seeding and queue</summary>
    <form id="rules-form" class="limits">
      <label>Slow mode download, KiB/s <input id="rule-slow_down_kib" type="number" min="0" max="4000000" inputmode="numeric"></label>
      <label>Slow mode upload, KiB/s <input id="rule-slow_up_kib" type="number" min="0" max="4000000" inputmode="numeric"></label>
      <label>Stop seeding at ratio, % <input id="rule-ratio_limit_pct" type="number" min="0" max="1000000" inputmode="numeric"></label>
      <label>Stop seeding after, minutes <input id="rule-seed_time_min" type="number" min="0" max="10000000" inputmode="numeric"></label>
      <label>Stop after no upload for, minutes <input id="rule-seed_idle_min" type="number" min="0" max="10000000" inputmode="numeric"></label>
      <label>Downloads at once <input id="rule-max_downloads" type="number" min="0" max="100000" inputmode="numeric"></label>
      <label>Seeding at once <input id="rule-max_seeding" type="number" min="0" max="100000" inputmode="numeric"></label>
      <label>Active at once <input id="rule-max_active" type="number" min="0" max="100000" inputmode="numeric"></label>
      <button>Set</button>
      <span class="muted">0 means no limit. A ratio of 1.5 is 150%. Schedules are set in the app.</span>
    </form>
  </details>

  <footer class="muted center" id="footer"></footer>
</main>

<dialog id="remove-dialog">
  <form method="dialog">
    <h2>Remove this torrent?</h2>
    <p id="remove-name"></p>
    <label class="check"><input id="remove-files" type="checkbox"> Also delete the downloaded files</label>
    <div class="row end">
      <button value="cancel">Cancel</button>
      <button value="remove" class="danger">Remove</button>
    </div>
  </form>
</dialog>

<dialog id="files-dialog">
  <form method="dialog">
    <h2>Choose files</h2>
    <p id="files-name" class="muted"></p>
    <div id="files-list" class="files"></div>
    <div class="row end">
      <button value="cancel">Cancel</button>
      <button value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="category-dialog">
  <form method="dialog">
    <h2>Category</h2>
    <p id="category-name" class="muted"></p>
    <input id="category-text" type="text" list="category-known" maxlength="100" autocomplete="off"
           aria-label="Category" placeholder="None">
    <datalist id="category-known"></datalist>
    <div class="row end">
      <button type="button" id="category-cancel">Cancel</button>
      <button value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>
</body>
</html>
